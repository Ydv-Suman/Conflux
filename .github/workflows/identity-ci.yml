name: Identity CI

on:
  push:
    branches: [main]
    paths:
      - services/identity-service/**
      - .github/workflows/identity-ci.yml
  pull_request:
    paths:
      - services/identity-service/**
      - .github/workflows/identity-ci.yml

concurrency:
  group: identity-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: identityDB
          POSTGRES_PASSWORD: identity123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d identityDB"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/identityDB
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: identity123
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: services/identity-service/pom.xml

      - name: Test and package identity service
        run: ./mvnw verify
        working-directory: services/identity-service
