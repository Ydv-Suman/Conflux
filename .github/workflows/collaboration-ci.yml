name: Collaboration CI

on:
  push:
    branches: [main]
    paths:
      - services/collaboration-service/**
      - desktop/src/features/editor/**
      - desktop/package*.json
      - .github/workflows/collaboration-ci.yml
  pull_request:
    paths:
      - services/collaboration-service/**
      - desktop/src/features/editor/**
      - desktop/package*.json
      - .github/workflows/collaboration-ci.yml

concurrency:
  group: collaboration-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: services/collaboration-service/pom.xml

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/collaboration-service/validator/package-lock.json

      - name: Install and test Yjs validator
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
        working-directory: services/collaboration-service/validator

      - name: Install desktop dependencies for real protocol integration tests
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: desktop

      - name: Test and package collaboration service
        run: ./mvnw verify
        working-directory: services/collaboration-service
