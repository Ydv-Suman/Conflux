name: Collaboration CI

on:
  push:
    branches: [main]
    paths:
      - services/collaboration-service/**
      - .github/workflows/collaboration-ci.yml
  pull_request:
    paths:
      - services/collaboration-service/**
      - .github/workflows/collaboration-ci.yml

concurrency:
  group: collaboration-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: services/collaboration-service/pom.xml

      - name: Test and package collaboration service
        run: ./mvnw verify
        working-directory: services/collaboration-service
