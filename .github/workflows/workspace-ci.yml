name: Workspace CI

on:
  push:
    branches: [main]
    paths:
      - services/workspace-service/**
      - .github/workflows/workspace-ci.yml
  pull_request:
    paths:
      - services/workspace-service/**
      - .github/workflows/workspace-ci.yml

concurrency:
  group: workspace-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: workspaceDB
          POSTGRES_PASSWORD: workspace123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d workspaceDB"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_URL: jdbc:postgresql://localhost:5432/workspaceDB
      DB_USERNAME: postgres
      DB_PASSWORD: workspace123
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: services/workspace-service/pom.xml

      - name: Generate ephemeral JWT verification key
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "${RUNNER_TEMP}/jwt-private.pem"
          openssl pkey -in "${RUNNER_TEMP}/jwt-private.pem" -pubout -out "${RUNNER_TEMP}/jwt-public.pem"
          echo "JWT_PUBLIC_KEY=file:${RUNNER_TEMP}/jwt-public.pem" >> "${GITHUB_ENV}"

      - name: Test and package workspace service
        run: ./mvnw verify
        working-directory: services/workspace-service
