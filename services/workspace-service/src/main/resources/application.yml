server:
  port: 9000
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

spring:
  application:
    name: workspace-service
  config:
    import:
      - optional:file:./secrets/.env[.properties]
      - optional:file:services/workspace-service/secrets/.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
  flyway:
    baseline-on-migrate: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8080}
    audience: ${JWT_AUDIENCE:conflux-api}
    public-key: ${JWT_PUBLIC_KEY:file:./secrets/jwt-public.pem}
