server:
  port: 8080
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

spring:
  application:
    name: identity-service
  config:
    import:
      - optional:file:./secrets/.env[.properties]
      - optional:file:services/identity-service/secrets/.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    baseline-on-migrate: true
  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  mail-from: ${MAIL_FROM:no-reply@conflux.local}
  base-url: ${APP_BASE_URL:http://localhost:5173}
  email-verification-ttl: ${EMAIL_VERIFICATION_TTL:24h}
  auth:
    secure-cookies: ${AUTH_SECURE_COOKIES:false}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Strict}
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8080}
    audience: ${JWT_AUDIENCE:conflux-api}
    access-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-ttl: ${JWT_REFRESH_TTL:30d}
    public-key: ${JWT_PUBLIC_KEY:file:./secrets/jwt-public.pem}
    private-key: ${JWT_PRIVATE_KEY:file:./secrets/jwt-private.pem}
